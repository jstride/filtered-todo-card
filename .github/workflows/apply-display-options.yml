name: Apply display options update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-display-options.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update card and documentation
        run: |
          python <<'PY'
          from pathlib import Path

          js_path = Path("filtered-todo-card.js")
          js = js_path.read_text()

          replacements = [
              (
                  '''            { name: "show_due", selector: { boolean: {} } },
            { name: "show_description", selector: { boolean: {} } },
            { name: "hide_empty", selector: { boolean: {} } },''',
                  '''            { name: "show_summary", selector: { boolean: {} } },
            { name: "show_due", selector: { boolean: {} } },
            { name: "show_description", selector: { boolean: {} } },
            { name: "show_completed", selector: { boolean: {} } },
            { name: "hide_empty", selector: { boolean: {} } },'''
              ),
              (
                  '''          show_due: "Show due date",
          show_description: "Show description",
          hide_empty: "Hide card when empty",''',
                  '''          show_summary: "Show summary",
          show_due: "Show due date",
          show_description: "Show description",
          show_completed: "Show completed tasks",
          hide_empty: "Hide card when empty",'''
              ),
              (
                  '''      sort: "due_asc",
      show_due: false,
      show_description: false,
      empty_text: "Nothing due",''',
                  '''      sort: "due_asc",
      show_summary: true,
      show_due: false,
      show_description: false,
      show_completed: false,
      empty_text: "Nothing due",'''
              ),
              (
                  '''  _buildCacheKey() {
    const status = Array.isArray(this.config.status)
      ? [...this.config.status].sort()
      : this.config.status;
    return `filtered-todo-card:v${FilteredTodoCard.CACHE_VERSION}:${this.config.entity}:${JSON.stringify(status)}`;
  }''',
                  '''  _requestedStatus() {
    if (!this.config.show_completed) return this.config.status;

    const statuses = Array.isArray(this.config.status)
      ? [...this.config.status]
      : [this.config.status];

    if (!statuses.includes("needs_action")) statuses.push("needs_action");
    if (!statuses.includes("completed")) statuses.push("completed");
    return statuses.sort();
  }

  _buildCacheKey() {
    const status = this._requestedStatus();
    return `filtered-todo-card:v${FilteredTodoCard.CACHE_VERSION}:${this.config.entity}:${JSON.stringify(status)}`;
  }'''
              ),
              (
                  '''        { status: this.config.status },''',
                  '''        { status: this._requestedStatus() },'''
              ),
              (
                  '''      this.items = this.items.filter((item) => item.uid !== uid);''',
                  '''      if (this.config.show_completed) {
        this.items = this.items.map((item) =>
          item.uid === uid ? { ...item, status: "completed" } : item
        );
      } else {
        this.items = this.items.filter((item) => item.uid !== uid);
      }'''
              ),
              (
                  '''          const pending = this._pending.has(uid);
          const summary = this._escapeHtml(this._stripSummary(item.summary));''',
                  '''          const pending = this._pending.has(uid);
          const completed = item.status === "completed";
          const summaryText = this._escapeHtml(this._stripSummary(item.summary));
          const summary = this.config.show_summary
            ? `<div class="summary">${summaryText}</div>`
            : "";'''
              ),
              (
                  '''          const description =
            this.config.show_description && item.description
              ? `<div class="description">${this._escapeHtml(item.description)}</div>`
              : "";''',
                  '''          const description =
            this.config.show_description && item.description
              ? `<div class="description${this.config.show_summary ? "" : " primary-description"}">${this._escapeHtml(item.description)}</div>`
              : "";'''
              ),
              (
                  '''          const checkbox = this.config.allow_complete
            ? `<button class="complete" data-uid="${encodedUid}" ${pending ? "disabled" : ""} aria-label="Mark item complete">
                 <ha-icon icon="${pending ? "mdi:progress-clock" : "mdi:checkbox-blank-outline"}"></ha-icon>
               </button>`
            : "";''',
                  '''          const checkbox = this.config.allow_complete
            ? `<button class="complete${completed ? " completed" : ""}" data-uid="${encodedUid}" ${pending || completed ? "disabled" : ""} aria-label="${completed ? "Completed" : "Mark item complete"}">
                 <ha-icon icon="${pending ? "mdi:progress-clock" : completed ? "mdi:checkbox-marked" : "mdi:checkbox-blank-outline"}"></ha-icon>
               </button>`
            : "";'''
              ),
              (
                  '''                      <div class="summary">${summary}</div>
                      ${due}''',
                  '''                      ${summary}
                      ${due}'''
              ),
              (
                  '''        .complete:disabled { cursor: default; opacity: 0.6; }
        .complete ha-icon { --mdc-icon-size: 26px; }''',
                  '''        .complete:disabled { cursor: default; opacity: 0.6; }
        .complete.completed:disabled { opacity: 1; }
        .complete ha-icon { --mdc-icon-size: 26px; }'''
              ),
              (
                  '''        .meta, .description { margin-top: 3px; }
        .message { padding: 12px 0; }''',
                  '''        .meta, .description { margin-top: 3px; }
        .description.primary-description {
          display: flex;
          align-items: center;
          min-height: 36px;
          margin-top: 0;
          color: var(--primary-text-color);
          font-size: 16px;
        }
        .message { padding: 12px 0; }'''
              ),
          ]

          for old, new in replacements:
              count = js.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one JS match, got {count}: {old[:80]!r}")
              js = js.replace(old, new, 1)

          js_path.write_text(js)

          readme_path = Path("README.md")
          readme = readme_path.read_text()

          readme_replacements = [
              (
                  '''- Strip tags or prefixes from displayed task names without modifying the source task
- Mark tasks complete from the card''',
                  '''- Strip tags or prefixes from displayed task names without modifying the source task
- Show or hide the task summary independently of the description
- Optionally include completed tasks alongside active tasks
- Mark active tasks complete from the card'''
              ),
              (
                  '''- Due-date and description display
- Empty-card behaviour''',
                  '''- Summary, due-date, and description display
- Optional completed-task display
- Empty-card behaviour'''
              ),
              (
                  '''| `sort` | No | `due_asc` | `due_asc`, `due_desc`, `summary_asc`, `summary_desc`, or `none` |
| `show_due` | No | `false` | Show the source due value below the summary |
| `show_description` | No | `false` | Show item descriptions |''',
                  '''| `sort` | No | `due_asc` | `due_asc`, `due_desc`, `summary_asc`, `summary_desc`, or `none` |
| `show_summary` | No | `true` | Show the item summary. Disable for description-only cards |
| `show_due` | No | `false` | Show the source due value |
| `show_description` | No | `false` | Show item descriptions |
| `show_completed` | No | `false` | Include completed items alongside the normally requested status |'''
              ),
          ]

          for old, new in readme_replacements:
              count = readme.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one README match, got {count}: {old[:80]!r}")
              readme = readme.replace(old, new, 1)

          marker = '''This displays incomplete items from `todo.tasks` that are due today and contain `[Work]` in the summary. The tag is removed from the displayed summary only - the source task is unchanged.\n'''
          addition = '''
## Description-only example

The summary is shown by default. To use the description as the primary displayed text instead:

```yaml
type: custom:filtered-todo-card
entity: todo.tasks
title: Notes
filter:
  due: today
show_summary: false
show_description: true
```

## Showing completed tasks

Completed items are hidden by default. To show them alongside active items:

```yaml
type: custom:filtered-todo-card
entity: todo.tasks
show_completed: true
```

The card requests both `needs_action` and `completed` items in a single `todo.get_items` call. Completed items use a checked icon and remain visible when `show_completed` is enabled.
'''
          if marker not in readme:
              raise SystemExit("README insertion marker not found")
          readme = readme.replace(marker, marker + addition, 1)
          readme_path.write_text(readme)
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/apply-display-options.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add filtered-todo-card.js README.md .github/workflows/apply-display-options.yml
          git commit -m "Add summary and completed display options"
          git push
