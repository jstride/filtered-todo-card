name: Apply display options update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-display-options.yml
      - .github/trigger-display-options

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update card and documentation
        run: |
          echo '' | base64 -d > /tmp/update.py
          python /tmp/update.py

      - name: Remove one-shot helper files and commit
        run: |
          rm .github/workflows/apply-display-options.yml .github/trigger-display-options
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add filtered-todo-card.js README.md .github/workflows/apply-display-options.yml .github/trigger-display-options
          git commit -m "Add summary and completed display options"
          git push
