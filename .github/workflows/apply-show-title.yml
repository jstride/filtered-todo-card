name: Apply show title option

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-show-title.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update card
        run: |
          sed -i '/{ name: "show_summary", selector: { boolean: {} } },/i\            { name: "show_title", selector: { boolean: {} } },' filtered-todo-card.js
          sed -i '/show_summary: "Show summary",/i\          show_title: "Show title",' filtered-todo-card.js
          sed -i '/      show_summary: true,/i\      show_title: true,' filtered-todo-card.js
          sed -i 's/${title === false || title === "" ? "" : `/${!this.config.show_title || title === false || title === "" ? "" : `/' filtered-todo-card.js

      - name: Update README
        run: |
          sed -i '/- Summary, due-date, and description display/i\- Card title display' README.md
          sed -i '/| `show_summary` | No | `true` | Show the item summary/i\| `show_title` | No | `true` | Show the card title |' README.md
          sed -i '/## Description-only example/i\## Hiding the card title\n\nThe card title is shown by default. To hide it while keeping the card contents:\n\n```yaml\ntype: custom:filtered-todo-card\nentity: todo.tasks\ntitle: School\nshow_title: false\n```\n' README.md

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/apply-show-title.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add filtered-todo-card.js README.md .github/workflows/apply-show-title.yml
          git commit -m "Add hide title display option"
          git push
